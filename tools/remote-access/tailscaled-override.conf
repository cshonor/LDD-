# Tailscale 开机自愈 drop-in
#
# 为什么需要这个：
#   官方 tailscaled.service 只写了 After=network-pre.target，
#   而 network-pre.target 在「网络栈开始配置之前」就算完成。
#   树莓派走 WiFi，从 network-pre 到真正拿到 IP 可能差好几秒。
#   结果是：tailscaled 启动了，但此时还没有可用网络，隧道建不起来。
#   而 Restart=on-failure 只在进程**崩溃**时才重启，
#   「进程活着但没网」这种情况它不管 —— 你就会发现人在公司连不回家。
#
#   加上 network-online.target 后，systemd 会等 NetworkManager-wait-online
#   确认网络真正就绪（已 enabled）才启动 tailscaled。
#
# 安装位置：/etc/systemd/system/tailscaled.service.d/override.conf

[Unit]
After=network-online.target
Wants=network-online.target

[Service]
# 进程崩溃后 5 秒重启，而不是 systemd 默认的 100ms
# （避免网络抖动时疯狂重启）
Restart=on-failure
RestartSec=5
